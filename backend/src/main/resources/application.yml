spring:
  application:
    name: ecotrack
  data:
    mongodb:
      uri: mongodb://localhost:27017/ecotrack
      # sem isso o spring ignora os @Indexed/@CompoundIndex das entidades
      auto-index-creation: true

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs