  <!-- papel caindo na lixeira certa -->
  <g transform="translate(88 52) rotate(14)">
    <rect width="30" height="38" rx="4" fill="#fff" stroke="#3b82c4" stroke-width="3"/>
    <path d="M7 12H23M7 21H23M7 30H17" stroke="#3b82c4" stroke-width="3" stroke-linecap="round"/>
  </g>
  <path d="M200 36C168 24 146 38 132 62" stroke="#123d2b" stroke-opacity=".55" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9"/>
