    <use href="#lixeira" fill="#3fae7c"/>
    <rect x="-2" y="-18" width="100" height="16" rx="7" fill="#2f9366"/>
    <path d="M43 50H53V68Q64 76 64 90V100Q64 106 58 106H38Q32 106 32 100V90Q32 76 43 68Z" fill="#fff" fill-opacity=".9"/>
