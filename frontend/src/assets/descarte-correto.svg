<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" fill="none">
  <defs>
    <path id="lixeira" d="M0 0H96L88 166Q87 172 81 172H15Q9 172 8 166Z"/>
  </defs>
  <ellipse cx="360" cy="326" rx="340" ry="10" fill="#123d2b" fill-opacity=".10"/>

  <!-- papel (azul), com a tampa aberta -->
  <g transform="translate(60 150)">
    <use href="#lixeira" fill="#3b82c4"/>
    <g transform="rotate(-24 0 -6)"><rect x="-2" y="-18" width="100" height="16" rx="7" fill="#2f6ca8"/></g>
    <rect x="30" y="50" width="36" height="46" rx="4" fill="#fff" fill-opacity=".9"/>
    <path d="M37 64H59M37 74H59M37 84H51" stroke="#3b82c4" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- plastico (vermelho) -->
  <g transform="translate(220 150)">
    <use href="#lixeira" fill="#d4574e"/>
    <rect x="-2" y="-18" width="100" height="16" rx="7" fill="#b9443c"/>
    <path d="M42 52H54V60Q62 66 62 78V98Q62 104 56 104H40Q34 104 34 98V78Q34 66 42 60Z" fill="#fff" fill-opacity=".9"/>
  </g>

  <!-- vidro (verde) -->
